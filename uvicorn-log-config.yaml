version: 1
disable_existing_loggers: false
formatters:
  default:
    (): app.core.logging.UvicornAppFormatter
    fmt: "%(asctime)s %(levelprefix)s %(display_name)s%(request_id_part)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors:
  access:
    (): app.core.logging.UvicornAccessFormatter
    fmt: "%(asctime)s %(levelprefix)s %(display_name)s%(request_id_part)s %(client_addr)s - \"%(request_line)s\" %(status_code)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors:
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn:
    handlers:
      - default
    level: INFO
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    handlers:
      - access
    level: INFO
    propagate: false
