[project]
name = "fastapi-users-service"
version = "0.1.0"
description = "Minimal FastAPI users service with auth, logging, and MySQL."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic-settings>=2.6.1,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0,<1.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "uvicorn[standard]>=0.30.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.3.3,<9.0.0",
    "ruff>=0.11.11,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]
